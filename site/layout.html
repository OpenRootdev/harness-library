<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  @@METADATA@@
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/harness-library/assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="/harness-library/assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/harness-library/style.css">
  <script src="/harness-library/app.js" defer></script>
</head>
<body data-page="@@PAGE@@" data-site-base="/harness-library/">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="header wrap">
    <a class="brand" href="/harness-library/" aria-label="Harness Library home"><img src="/harness-library/assets/mark.svg" alt="" width="48" height="44">Harness Library</a>
    <nav aria-label="Main navigation">
      <a class="nav-browse" href="/harness-library/" @@BROWSE_CURRENT@@>Browse</a>
      <a href="/harness-library/submit/" @@SUBMIT_CURRENT@@>Submit a harness</a>
      <a class="github" href="https://github.com/OpenRootdev/harness-library" aria-label="Harness Library on GitHub"><svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><use href="/harness-library/assets/icons.svg#GithubLogo"></use></svg><span>GitHub</span></a>
    </nav>
  </div></header>
  <main id="main" class="wrap" tabindex="-1">@@CONTENT@@</main>
  <footer class="wrap footer"><p>Open submissions. Clear setup. Portable packages.</p><div>
    <a href="/harness-library/submit/">Submission guide</a>
    <a href="/harness-library/about/">About the library</a>
    <a href="https://github.com/OpenRootdev/harness-library/blob/main/docs/badge-program.md">14-day badge boost</a>
    <a href="/harness-library/llms.txt">For agents</a>
    <a href="https://harneloop.kaelux.dev">Harneloop ↗</a>
  </div></footer>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
