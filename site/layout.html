<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  @@METADATA@@
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="@@BASE@@assets/mark.svg" type="image/svg+xml">
  <link rel="preload" href="@@BASE@@assets/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="@@BASE@@style.css">
  <script src="@@BASE@@app.js" defer></script>
</head>
<body data-page="@@PAGE@@" data-site-base="@@BASE@@">
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header"><div class="header wrap">
    <a class="brand" href="@@BASE@@" aria-label="ToolIndex home"><img src="@@BASE@@assets/mark.svg" alt="" width="48" height="44">ToolIndex</a>
    <nav aria-label="Main navigation">
      <a class="nav-browse" href="@@BASE@@" @@BROWSE_CURRENT@@>Browse</a>
      <a href="@@BASE@@submit/" @@SUBMIT_CURRENT@@>Submit a tool</a>
      <a href="@@BASE@@people/">Creators</a>
      <a href="@@BASE@@account/">Your account</a>
      <a class="github" href="https://github.com/OpenRootdev/toolindex" aria-label="ToolIndex on GitHub"><svg class="icon" viewBox="0 0 256 256" aria-hidden="true"><use href="@@BASE@@assets/icons.svg#GithubLogo"></use></svg><span>GitHub</span></a>
    </nav>
  </div></header>
  <main id="main" class="wrap" tabindex="-1">@@CONTENT@@</main>
  <footer class="wrap footer"><p>Tools for AI agents. Clear setup. Direct source links.</p><div>
    <a href="@@BASE@@submit/">Submission guide</a>
    <a href="@@BASE@@about/">About ToolIndex</a>
    <a href="https://github.com/OpenRootdev/toolindex/blob/main/docs/badge-program.md">14-day badge boost</a>
    <a href="@@BASE@@llms.txt">For agents</a>
    <a href="@@BASE@@developers/">API &amp; MCP</a>
    <a href="https://harneloop.kaelux.dev">Harneloop ↗</a>
  </div></footer>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
