name: Check submission
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python scripts/catalog.py validate
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_i18n.py
      - run: python scripts/catalog.py build
      - run: node --check site/app.js
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend --ignore-scripts
      - run: npm test --prefix backend
      - run: node --check site/account.js
