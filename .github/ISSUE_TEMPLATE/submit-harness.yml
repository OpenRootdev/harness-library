name: Submit a harness
description: Share a reusable agent harness with clear setup instructions.
title: "[Harness] "
labels: [submission]
body:
  - type: markdown
    attributes:
      value: |
        **New submissions are welcome — a useful skill folder can be enough.**
        Share your repository and setup below. No fork, pull request or Harneloop dependency is required.
        A maintainer reviews the instructions and package scope, asks questions here if needed, and publishes approved listings.
        [Read the short submission guide](https://openrootdev.github.io/harness-library/submit/).
  - type: input
    id: name
    attributes:
      label: Harness name
    validations:
      required: true
  - type: input
    id: repository
    attributes:
      label: Public source repository
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Purpose and category
      description: "What job does it help an agent do? Suggested category: Creative, 3D & Blender, Coding, Research, Data, Operations or Other."
    validations:
      required: true
  - type: textarea
    id: install
    attributes:
      label: Installation instructions
      description: Include ordered steps, prerequisites, working directory, agent/client integration and first use.
    validations:
      required: true
  - type: textarea
    id: distribution
    attributes:
      label: Focused distribution, version and license
      description: Link the package or dedicated harness branch. If the repo contains unrelated material, specify how users install only the harness. Include license/attribution requirements.
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Manual connections and additional notes
      description: Tools, MCPs, credentials or manual setup required. Write 'none' where appropriate. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: contents
    attributes:
      label: Optional composition and evidence
      description: Skills, files, references, top-level tools, tested artifacts/platforms, and Built with Harneloop evidence if applicable.
